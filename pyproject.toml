[project]
name = "telegram-ai-sales-bot"
version = "1.0.0"
description = "AI sales assistant for Telegram: answers from a product catalog, takes orders, hands chats to staff."
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs TEST_DATABASE_URL (a Postgres database); skipped when it is not set",
]

[tool.ruff]
line-length = 125
target-version = "py314"
extend-exclude = ["data", "scrape.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # likely bugs
    "UP",           # modern syntax
    "SIM",          # simplifications
    "ASYNC",        # blocking calls in async code
    "S",            # security (bandit)
    "RUF",          # ruff-specific
]
ignore = [
    "S101",    # assert is how pytest checks, and marks invariants in sessions.py
    "S608",    # SQL is built only from fixed fragments; every value goes in as a $n parameter
    "RUF001",  # Cyrillic letters in strings are the product's language, not look-alike typos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # fake tokens in test settings

[tool.mypy]
python_version = "3.14"
packages = ["salesbot"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true  # asyncpg ships no type information
